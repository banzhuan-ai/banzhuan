[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banzhuan"
version = "0.1.0"
description = "Python SDK for BanZhuan.AI Builder, research, backtests, and strategy management."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "BanZhuan.AI" }]
dependencies = [
  "requests>=2.31.0,<3",
]
keywords = ["banzhuan", "trading", "builder", "ai", "hyperliquid", "edgex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://banzhuan.ai"
Documentation = "https://banzhuan.ai/credits"
Repository = "https://github.com/banzhuan-ai/banzhuan"

[project.scripts]
banzhuan = "banzhuan.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["banzhuan*"]
